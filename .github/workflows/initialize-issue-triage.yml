name: Initialize issue triage

on:
  issues:
    types: [opened, reopened]

permissions:
  issues: write

jobs:
  initialize:
    runs-on: ubuntu-latest
    steps:
      - name: Add initial triage metadata
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0 (Node 24)
        with:
          script: |
            const issue = context.payload.issue;
            if (issue.pull_request) return;

            const names = issue.labels.map((label) =>
              typeof label === "string" ? label : label.name
            );
            const add = [];

            if (!names.some((name) => name.startsWith("status:"))) {
              add.push("status:needs-triage");
            }

            if (
              (issue.body ?? "").includes("<!-- triage-discord-feedback:") &&
              !names.includes("source:discord")
            ) {
              add.push("source:discord");
            }

            if (add.length > 0) {
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: issue.number,
                labels: add,
              });
            }
